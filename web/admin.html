<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sentry — админка</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --ink: #1c1e21; --muted: #6b7280;
    --line: #e4e7eb; --accent: #2f6feb; --accent-ink: #fff;
    --ok: #1a7f37; --warn: #b5850b; --err: #c23b22;
    --soft: #f0f3f8;
    --radius: 14px;
    --shadow: 0 1px 2px rgba(16,24,40,.04), 0 6px 16px -4px rgba(16,24,40,.08);
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181c; --card: #1e2127; --ink: #e7e9ec; --muted: #9aa1ab;
      --line: #2c313a; --accent: #5c8bf5; --accent-ink: #0b1220;
      --ok: #4ac26b; --warn: #e0b341; --err: #e8794f;
      --soft: #23272f;
      --shadow: 0 1px 2px rgba(0,0,0,.24), 0 10px 26px -8px rgba(0,0,0,.5);
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  header { position: sticky; top: 0; z-index: 20;
    display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
    padding: 14px 20px; border-bottom: 1px solid var(--line);
    background: var(--card);
    background: color-mix(in srgb, var(--card) 86%, transparent);
    backdrop-filter: saturate(1.4) blur(8px); }
  header h1 { font-size: 16px; margin: 0; font-weight: 650; letter-spacing: -.01em; }
  header .spacer { flex: 1; }
  .tabs { display: flex; gap: 4px; }
  .tabs button { border: 1px solid var(--line); background: var(--bg); color: var(--ink);
    padding: 6px 13px; border-radius: 8px; cursor: pointer; font-size: 13px;
    transition: background .15s ease, border-color .15s ease; }
  .tabs button:hover { border-color: var(--accent); }
  .tabs button.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  main { padding: 20px; max-width: 1000px; margin: 0 auto; }
  .btn { border: 1px solid var(--line); background: var(--bg); color: var(--ink);
    padding: 7px 13px; border-radius: 8px; cursor: pointer; font-size: 13px;
    transition: background .15s ease, border-color .15s ease; }
  .btn:hover { border-color: var(--accent); background: var(--soft); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .btn.primary:hover { filter: brightness(1.05); }
  .btn.danger { color: var(--err); border-color: var(--err); }
  .btn:disabled { opacity: .5; cursor: default; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 16px 18px; margin-bottom: 14px; box-shadow: var(--shadow); }
  .card h2 { font-size: 13px; margin: 0 0 12px; font-weight: 620; color: var(--muted);
    text-transform: uppercase; letter-spacing: .04em; }
  .qhead { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .qhead .key { font-weight: 680; font-size: 15px; }
  .qhead .title { color: var(--muted); }
  .pill { font-size: 11px; padding: 2px 8px; border-radius: 20px; border: 1px solid var(--line); }
  .pill.on { color: var(--ok); border-color: var(--ok); }
  .pill.off { color: var(--muted); }
  .pill.def { color: var(--accent); border-color: var(--accent); }
  .pill.bad { color: var(--err); border-color: var(--err); }
  .meta { color: var(--muted); font-size: 12px; margin: 8px 0; display: flex; gap: 16px; flex-wrap: wrap; }
  .rowbtns { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .hookline { font-size: 12px; color: var(--muted); margin-top: 8px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  code { background: var(--soft); padding: 2px 6px; border-radius: 5px; font-size: 12px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; word-break: break-all; }
  form.grid { display: grid; grid-template-columns: 190px 1fr; gap: 10px 14px; align-items: center; }
  form.grid label { color: var(--muted); font-size: 13px; }
  form.grid .full { grid-column: 1 / -1; }
  input[type=text], input[type=password], input[type=number], select, textarea {
    width: 100%; padding: 7px 9px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--bg); color: var(--ink); font: inherit;
    transition: border-color .15s ease, box-shadow .15s ease; }
  input[type=text]:focus, input[type=password]:focus, input[type=number]:focus, select:focus, textarea:focus {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
  textarea { resize: vertical; }
  .hint { color: var(--muted); font-size: 12px; }
  .switch { display: flex; align-items: center; gap: 8px; }
  pre.log { background: #0c0e12; color: #d7dbe0; padding: 12px; border-radius: 10px;
    font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    overflow: auto; max-height: 62vh; white-space: pre; }
  @media (prefers-color-scheme: light) { pre.log { background: #10141b; } }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px;
    font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 50; }
  .toast.show { opacity: 1; }
  .toast.err { background: var(--err); color: #fff; }
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex;
    align-items: center; justify-content: center; z-index: 40; padding: 16px; }
  .overlay .card { max-width: 380px; width: 100%; margin: 0; }
  .modal-body { max-width: 560px; }
  .hidden { display: none !important; }
  .empty { color: var(--muted); text-align: center; padding: 30px 0; }
  h3.section { font-size: 13px; color: var(--muted); text-transform: uppercase;
    letter-spacing: .04em; margin: 18px 0 8px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>

<header class="hidden" id="topbar">
  <h1>Sentry · админка</h1>
  <div class="tabs" id="tabs">
    <button data-tab="queues" class="active">Очереди</button>
    <button data-tab="settings">Общие настройки</button>
    <button data-tab="logs">Логи</button>
  </div>
  <div class="spacer"></div>
  <a class="btn" href="/dashboard" target="_blank" rel="noopener">Дашборд ↗</a>
  <button class="btn" id="logout">Выйти</button>
</header>

<main class="hidden" id="app">
  <section id="tab-queues"></section>
  <section id="tab-settings" class="hidden"></section>
  <section id="tab-logs" class="hidden"></section>
</main>

<div class="overlay" id="login">
  <div class="card">
    <h2>Вход в админку</h2>
    <div id="login-msg" class="hint" style="margin-bottom:10px"></div>
    <form id="login-form">
      <input type="password" id="login-pw" placeholder="Пароль" autocomplete="current-password" autofocus>
      <div style="margin-top:12px; display:flex; justify-content:flex-end">
        <button class="btn primary" type="submit">Войти</button>
      </div>
    </form>
  </div>
</div>

<div class="overlay hidden" id="modal">
  <div class="card modal-body">
    <h2 id="modal-title">Очередь</h2>
    <div id="modal-content"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

let toastTimer = null;
function toast(msg, isErr) {
  const t = $("#toast");
  t.textContent = msg;
  t.className = "toast show" + (isErr ? " err" : "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (t.className = "toast"), 3200);
}

async function api(path, opts = {}) {
  const r = await fetch("/admin/api" + path, {
    headers: { "Content-Type": "application/json" },
    ...opts,
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  if (r.status === 401) { showLogin(); throw new Error("Требуется вход"); }
  let data = null;
  try { data = await r.json(); } catch (_) {}
  if (!r.ok) throw new Error((data && data.detail) || ("HTTP " + r.status));
  return data;
}

// ---------- auth ----------
function showLogin(msg) {
  $("#login").classList.remove("hidden");
  $("#topbar").classList.add("hidden");
  $("#app").classList.add("hidden");
  if (msg) $("#login-msg").textContent = msg;
}
function showApp() {
  $("#login").classList.add("hidden");
  $("#topbar").classList.remove("hidden");
  $("#app").classList.remove("hidden");
}

$("#login-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  try {
    await api("/login", { method: "POST", body: { password: $("#login-pw").value } });
    $("#login-pw").value = "";
    showApp();
    switchTab("queues");
  } catch (err) {
    $("#login-msg").textContent = err.message;
  }
});

$("#logout").addEventListener("click", async () => {
  try { await api("/logout", { method: "POST" }); } catch (_) {}
  showLogin("Вы вышли");
});

// ---------- tabs ----------
function switchTab(name) {
  $$("#tabs button").forEach(b => b.classList.toggle("active", b.dataset.tab === name));
  ["queues", "settings", "logs"].forEach(t =>
    $("#tab-" + t).classList.toggle("hidden", t !== name));
  if (name === "queues") loadQueues();
  if (name === "settings") loadSettings();
  if (name === "logs") loadLogs();
}
$$("#tabs button").forEach(b => b.addEventListener("click", () => switchTab(b.dataset.tab)));

// ---------- modal ----------
function openModal(title, html) {
  $("#modal-title").textContent = title;
  $("#modal-content").innerHTML = html;
  $("#modal").classList.remove("hidden");
}
function closeModal() { $("#modal").classList.add("hidden"); $("#modal-content").innerHTML = ""; }
$("#modal").addEventListener("click", (e) => { if (e.target.id === "modal") closeModal(); });

// ---------- queues ----------
const origin = location.origin;
function fmtAgo(epoch) {
  if (!epoch) return "событий не было";
  const s = Math.max(0, Date.now() / 1000 - epoch);
  if (s < 90) return "только что";
  if (s < 3600) return Math.round(s / 60) + " мин назад";
  if (s < 86400) return Math.round(s / 3600) + " ч назад";
  return Math.round(s / 86400) + " дн назад";
}

async function loadQueues() {
  const box = $("#tab-queues");
  box.innerHTML = '<div class="empty">загрузка…</div>';
  let data;
  try { data = await api("/queues"); } catch (e) { box.innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }

  const head = `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
    <div class="hint">Очередей: ${data.queues.length}. Очередь по умолчанию: <code>${esc(data.default_queue_key)}</code> (её слушает старый <code>/webhook</code>).</div>
    <button class="btn primary" id="add-queue">+ Добавить очередь</button></div>`;

  const cards = data.queues.map(q => {
    const statusPills = [
      q.enabled ? '<span class="pill on">активна</span>' : '<span class="pill off">выключена</span>',
      q.is_default ? '<span class="pill def">по умолчанию</span>' : "",
      q.messenger_ready ? '<span class="pill on">мессенджер настроен</span>' : '<span class="pill bad">чат не настроен</span>',
    ].join(" ");
    const hookUrl = origin + q.webhook_path;
    const tokenPart = q.webhook_token_set
      ? `<span>токен: <code>${esc(q.webhook_token)}</code></span><button class="btn" data-copy="${esc(q.webhook_token)}">копировать токен</button>`
      : `<span class="hint">токен вебхука: общий (из настроек)</span>`;
    return `<div class="card">
      <div class="qhead">
        <span class="key">${esc(q.key)}</span>
        <span class="title">${esc(q.title || "—")}</span>
        ${statusPills}
      </div>
      <div class="meta">
        <span>окно: <b>${q.window_minutes} мин</b></span>
        <span>порог: <b>${q.threshold}</b> (алерт с ${q.threshold + 1}-й задачи)</span>
        <span>кулдаун: <b>${q.alert_cooldown_minutes ? q.alert_cooldown_minutes + " мин" : "выкл"}</b></span>
        <span>каналы: ${esc(q.channels || "—")}</span>
      </div>
      <div class="meta">
        <span>задач в окне: <b>${q.tasks_in_window}</b></span>
        <span>событий всего: <b>${q.events_total}</b></span>
        <span>последнее: ${fmtAgo(q.last_event_epoch)}</span>
      </div>
      <div class="hookline">
        <span>вебхук:</span> <code>${esc(hookUrl)}</code>
        <button class="btn" data-copy="${esc(hookUrl)}">копировать URL</button>
        ${tokenPart}
      </div>
      <div class="rowbtns">
        <button class="btn" data-edit="${esc(q.key)}">Редактировать</button>
        <button class="btn" data-test="${esc(q.key)}">Тест уведомления</button>
        <button class="btn" data-clear="${esc(q.key)}">Очистить данные</button>
        ${q.is_default ? "" : `<button class="btn danger" data-del="${esc(q.key)}">Удалить</button>`}
      </div>
    </div>`;
  }).join("");

  box.innerHTML = head + (cards || '<div class="empty">очередей нет</div>');

  $("#add-queue").addEventListener("click", () => queueForm(null));
  $$("[data-copy]", box).forEach(b => b.addEventListener("click", () => {
    navigator.clipboard.writeText(b.dataset.copy).then(() => toast("Скопировано"));
  }));
  $$("[data-edit]", box).forEach(b => b.addEventListener("click", () =>
    queueForm(data.queues.find(q => q.key === b.dataset.edit))));
  $$("[data-test]", box).forEach(b => b.addEventListener("click", () => testQueue(b.dataset.test, b)));
  $$("[data-clear]", box).forEach(b => b.addEventListener("click", () => clearQueue(b.dataset.clear)));
  $$("[data-del]", box).forEach(b => b.addEventListener("click", () => deleteQueue(b.dataset.del)));
}

function queueForm(q) {
  const isNew = !q;
  q = q || { window_minutes: 30, threshold: 1, alert_cooldown_minutes: 0, enabled: true, channels: "", chat_id: "", title: "" };
  openModal(isNew ? "Новая очередь" : `Очередь «${q.key}»`, `
    <form class="grid" id="qform">
      ${isNew ? `<label>Ключ *</label><div><input type="text" name="key" placeholder="SUPPORT" required>
        <div class="hint">латиница/цифры/дефис, 1–32 символа. Войдёт в URL вебхука, менять потом нельзя.</div></div>` : ""}
      <label>Название</label><input type="text" name="title" value="${esc(q.title || "")}" placeholder="Поддержка сайта, 1 линия">
      <label>Chat ID Мессенджера</label><input type="text" name="chat_id" value="${esc(q.chat_id || "")}" placeholder="0/0/&lt;uuid&gt;">
      <label>Токен Мессенджера</label><div><input type="text" name="messenger_token" placeholder="${q.messenger_token_set ? "•••••• (оставьте пустым — не менять)" : "по умолчанию из общих настроек"}">
        <div class="hint">Задавайте, только если у очереди отдельный бот.</div></div>
      <label>Окно поиска, мин</label><input type="number" name="window_minutes" min="1" value="${q.window_minutes}">
      <label>Порог дублей</label><div><input type="number" name="threshold" min="1" value="${q.threshold}">
        <div class="hint">Сколько совпадений в окне до алерта. 1 = сообщение приходит со 2-й задачи.</div></div>
      <label>Кулдаун алертов, мин</label><div><input type="number" name="alert_cooldown_minutes" min="0" value="${q.alert_cooldown_minutes || 0}">
        <div class="hint">Не слать повторный алерт по той же категории+тегу чаще, чем раз в N минут. 0 = без кулдауна (сообщение на каждую задачу всплеска).</div></div>
      <label>Каналы (теги)</label><input type="text" name="channels" value="${esc(q.channels || "")}" placeholder="Сайт, МП">
      <label>Токен вебхука</label><div><input type="text" name="webhook_token" placeholder="${q.webhook_token_set ? "задан (пустым — не менять)" : "пусто = общий токен"}">
        <div class="hint">Отдельный токен только для этой очереди. Пусто — используется общий.</div></div>
      <label>Активна</label><div class="switch"><input type="checkbox" name="enabled" ${q.enabled ? "checked" : ""}> приём вебхуков включён</div>
      <div class="full" style="display:flex;gap:8px;justify-content:flex-end;margin-top:6px">
        <button type="button" class="btn" id="qcancel">Отмена</button>
        <button type="submit" class="btn primary">${isNew ? "Создать" : "Сохранить"}</button>
      </div>
    </form>`);
  $("#qcancel").addEventListener("click", closeModal);
  $("#qform").addEventListener("submit", async (e) => {
    e.preventDefault();
    const f = e.target;
    const body = {
      title: f.title.value,
      chat_id: f.chat_id.value,
      messenger_token: f.messenger_token.value,
      window_minutes: Number(f.window_minutes.value),
      threshold: Number(f.threshold.value),
      alert_cooldown_minutes: Number(f.alert_cooldown_minutes.value),
      channels: f.channels.value,
      webhook_token: f.webhook_token.value,
      enabled: f.enabled.checked,
    };
    try {
      if (isNew) {
        body.key = f.key.value.trim();
        await api("/queues", { method: "POST", body });
        toast("Очередь создана");
      } else {
        await api("/queues/" + encodeURIComponent(q.key), { method: "PUT", body });
        toast("Сохранено");
      }
      closeModal();
      loadQueues();
    } catch (err) { toast(err.message, true); }
  });
}

async function testQueue(key, btn) {
  btn.disabled = true; btn.textContent = "отправка…";
  try {
    const r = await api("/queues/" + encodeURIComponent(key) + "/test", { method: "POST" });
    toast(r.message || "Отправлено");
  } catch (err) { toast(err.message, true); }
  finally { btn.disabled = false; btn.textContent = "Тест уведомления"; }
}

async function clearQueue(key) {
  if (!confirm(`Очистить все данные очереди «${key}» (окно, журналы, аналитику)?`)) return;
  try {
    const r = await api("/queues/" + encodeURIComponent(key) + "/clear", { method: "POST" });
    toast(`Удалено строк: ${r.cleared_entries}`);
    loadQueues();
  } catch (err) { toast(err.message, true); }
}

async function deleteQueue(key) {
  if (!confirm(`Удалить очередь «${key}» вместе со всеми её данными? Действие необратимо.`)) return;
  try {
    await api("/queues/" + encodeURIComponent(key), { method: "DELETE" });
    toast("Очередь удалена");
    loadQueues();
  } catch (err) { toast(err.message, true); }
}

// ---------- settings ----------
const LABELS = {
  messenger_url: "URL API Мессенджера",
  messenger_token: "Токен Мессенджера (общий)",
  tracker_url: "URL Яндекс Трекера",
  timezone_offset: "Сдвиг часового пояса (МСК = 3)",
  events_retention_days: "Хранить аналитику, дней (0 = вечно)",
  max_log_entries: "Записей в каждом журнале",
  webhook_token: "Общий токен вебхука",
  default_queue_key: "Очередь по умолчанию (ключ)",
  log_level: "Уровень логирования",
  admin_password: "Пароль админки",
  alert_cooldown_minutes: "Кулдаун алертов по умолчанию, мин (0 = выкл)",
};
const SECRET = new Set(["messenger_token", "webhook_token", "admin_password"]);

async function loadSettings() {
  const box = $("#tab-settings");
  box.innerHTML = '<div class="empty">загрузка…</div>';
  let cfg;
  try { cfg = await api("/config"); } catch (e) { box.innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }

  const rows = cfg.editable_keys.map(k => {
    const isSecret = SECRET.has(k);
    const label = LABELS[k] || k;
    if (k === "log_level") {
      const v = cfg.values[k] || "INFO";
      const opts = ["DEBUG", "INFO", "WARNING", "ERROR"].map(o =>
        `<option ${o === v ? "selected" : ""}>${o}</option>`).join("");
      return `<label>${label}</label><select name="${k}">${opts}</select>`;
    }
    if (isSecret) {
      const set = cfg.secret_flags[k + "_set"];
      return `<label>${label}</label><div>
        <input type="password" name="${k}" placeholder="${set ? "•••••• задано — введите новое, чтобы заменить" : "не задано"}">
        <div class="hint">${set ? "Значение скрыто. Пустое поле — оставить как есть." : "Пустое поле — оставить незаданным."}</div></div>`;
    }
    return `<label>${label}</label><input type="text" name="${k}" value="${esc(cfg.values[k] || "")}">`;
  }).join("");

  box.innerHTML = `<div class="card"><h2>Общие настройки</h2>
    <form class="grid" id="cfgform">${rows}
      <div class="full" style="display:flex;justify-content:flex-end;margin-top:8px">
        <button type="submit" class="btn primary">Сохранить</button>
      </div>
    </form>
    <div class="hint" style="margin-top:12px">Применяется сразу, без перезапуска. Смена общего токена вебхука
    потребует обновить заголовок в триггерах Трекера.</div>
  </div>`;

  $("#cfgform").addEventListener("submit", async (e) => {
    e.preventDefault();
    const f = e.target;
    const values = {}, secrets = {};
    cfg.editable_keys.forEach(k => {
      const el = f.elements[k];
      if (!el) return;
      if (SECRET.has(k)) { if (el.value.trim()) secrets[k] = el.value.trim(); }
      else values[k] = el.value;
    });
    try {
      const r = await api("/config", { method: "PUT", body: { values, secrets } });
      toast("Сохранено: " + (r.changed.join(", ") || "без изменений"));
      loadSettings();
    } catch (err) { toast(err.message, true); }
  });
}

// ---------- logs ----------
async function loadLogs() {
  const box = $("#tab-logs");
  if (!box.dataset.init) {
    box.dataset.init = "1";
    box.innerHTML = `<div class="card">
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <h2 style="margin:0">Файл лога процесса</h2>
        <span class="spacer" style="flex:1"></span>
        <label class="hint">строк:
          <select id="loglines"><option>200</option><option selected>300</option><option>800</option><option>2000</option></select>
        </label>
        <button class="btn" id="logrefresh">Обновить</button>
      </div>
      <div class="hint" id="logpath" style="margin:6px 0 10px"></div>
      <pre class="log" id="logbox">загрузка…</pre>
    </div>`;
    $("#logrefresh").addEventListener("click", fetchLog);
    $("#loglines").addEventListener("change", fetchLog);
  }
  fetchLog();
}
async function fetchLog() {
  try {
    const n = $("#loglines").value;
    const r = await api("/logs?lines=" + n);
    $("#logpath").innerHTML = "путь: <code>" + esc(r.file) + "</code>";
    const box = $("#logbox");
    box.textContent = r.lines.length ? r.lines.join("\n") : "(лог пуст)";
    box.scrollTop = box.scrollHeight;
  } catch (err) { $("#logbox").textContent = err.message; }
}

// ---------- boot ----------
(async function () {
  try {
    const s = await api("/session");
    if (s.authenticated) { showApp(); switchTab("queues"); }
    else showLogin(s.password_configured ? "" : "Пароль админки не задан — укажите ADMIN_PASSWORD в .env и перезапустите сервис.");
  } catch (_) { showLogin(); }
})();
</script>
